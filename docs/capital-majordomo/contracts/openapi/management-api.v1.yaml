openapi: 3.1.0
info:
  title: Capital-Majordomo Management API
  version: 1.0.0
  description: |
    API di gestione dei Trading Job, del rischio e del kill switch.
    Autenticazione OIDC (Entra ID), ruoli: viewer, operator, risk-admin.
    Tutte le operazioni che modificano stato accettano l'header Idempotency-Key.
servers:
  - url: https://majordomo.k-digitale.cloud
security:
  - oidc: []
tags:
  - name: jobs
  - name: risk
  - name: execution
  - name: reports
paths:
  /v1/jobs:
    get:
      tags: [jobs]
      summary: Elenco dei Trading Job
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradingJob' }
    post:
      tags: [jobs]
      summary: Crea un Trading Job in stato Draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '201':
          description: Creato
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Dettaglio di un job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingJob' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/jobs/{jobId}/parameters:
    parameters:
      - $ref: '#/components/parameters/JobId'
    put:
      tags: [jobs]
      summary: Nuova versione dei parametri (concorrenza ottimistica con If-Match)
      description: Un aumento dei limiti di rischio su un job Live lo porta in Paused e richiede risk-admin.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/trading-job-parameters.v1.schema.json' }
      responses:
        '200':
          description: Nuova ParameterSetVersion creata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingJob' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/jobs/{jobId}/transitions:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Cambia stato del job (promote, pause, resume, archive)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '202':
          description: Transizione accettata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/jobs/{jobId}/backtests:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Avvia un backtest walk-forward (asincrono)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                slippagePoints: { type: number, minimum: 0, default: 0.5 }
      responses:
        '202':
          description: Backtest in coda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /v1/jobs/{jobId}/decisions:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Decision log del job (audit)
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Pagina di decisioni
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
                  nextCursor: { type: [string, 'null'] }
  /v1/kill-switch:
    get:
      tags: [risk]
      summary: Stato del kill switch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
    post:
      tags: [risk]
      summary: Attiva il kill switch (globale o per job) - ruolo operator o risk-admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope: { enum: [global, job] }
                jobId: { type: string, format: uuid }
                reason: { type: string, minLength: 3 }
                closePositions: { type: boolean, default: true }
      responses:
        '202':
          description: Attivazione in corso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /v1/kill-switch/release:
    post:
      tags: [risk]
      summary: Disattiva il kill switch (solo risk-admin); i job restano Halted/Paused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Disattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
  /v1/positions:
    get:
      tags: [execution]
      summary: Posizioni aperte (vista riconciliata)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
  /v1/orders/{orderId}:
    get:
      tags: [execution]
      summary: Dettaglio ordine
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /v1/reports/performance:
    get:
      tags: [reports]
      summary: Performance per job o portafoglio
      parameters:
        - in: query
          name: jobId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReport' }
  /v1/operations/{operationId}:
    get:
      tags: [jobs]
      summary: Stato di un'operazione asincrona
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: Errore (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    JobStatus:
      enum: [Draft, Backtesting, PaperTrading, Live, Paused, Halted, Archived]
    CreateJobRequest:
      type: object
      required: [name, parameters]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string }
        parameters: { $ref: '../schemas/trading-job-parameters.v1.schema.json' }
    TradingJob:
      type: object
      required: [id, name, status, parameterSetVersion, etag]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        haltReason: { type: [string, 'null'] }
        parameterSetVersion: { type: integer }
        parameters: { $ref: '../schemas/trading-job-parameters.v1.schema.json' }
        etag: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransitionRequest:
      type: object
      required: [action]
      properties:
        action: { enum: [promote, pause, resume, archive] }
        reason: { type: string }
        evidenceOperationId:
          type: string
          format: uuid
          description: Backtest o periodo paper che giustifica la promozione (ADR-0006)
    Decision:
      type: object
      required: [id, jobId, barClose, outcome]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        parameterSetVersion: { type: integer }
        epic: { type: string }
        barClose: { type: string, format: date-time }
        model: { type: string }
        forecastFingerprint: { type: string }
        signal:
          type: object
          properties:
            direction: { enum: [Long, Short, Flat] }
            strength: { type: number }
            confidence: { type: number }
        outcome: { enum: [NoSignal, Rejected, Approved] }
        reason: { type: [string, 'null'] }
        orderId: { type: [string, 'null'], format: uuid }
        traceId: { type: string }
    Order:
      type: object
      required: [id, jobId, epic, direction, size, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        decisionId: { type: string, format: uuid }
        epic: { type: string }
        direction: { enum: [BUY, SELL] }
        size: { type: number }
        stopLevel: { type: number }
        profitLevel: { type: [number, 'null'] }
        status: { enum: [Pending, Submitted, Accepted, Rejected, Unknown, Failed] }
        dealReference: { type: [string, 'null'] }
        dealId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Position:
      type: object
      required: [dealId, epic, direction, size, openLevel]
      properties:
        dealId: { type: string }
        jobId: { type: [string, 'null'], format: uuid, description: null se la posizione non è originata dal sistema }
        epic: { type: string }
        direction: { enum: [BUY, SELL] }
        size: { type: number }
        openLevel: { type: number }
        stopLevel: { type: [number, 'null'] }
        profitLevel: { type: [number, 'null'] }
        unrealizedPnl: { type: number }
        currency: { type: string }
        openedAt: { type: string, format: date-time }
    KillSwitchState:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        scope: { enum: [global, job] }
        jobIds: { type: array, items: { type: string, format: uuid } }
        activatedBy: { type: string }
        activatedAt: { type: string, format: date-time }
        reason: { type: string }
    Operation:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [backtest, killSwitch] }
        status: { enum: [Queued, Running, Succeeded, Failed] }
        resultUrl: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    PerformanceReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        startingEquity: { type: number }
        endingEquity: { type: number }
        netPnl: { type: number }
        maxDrawdownPct: { type: number }
        sharpe: { type: number }
        profitFactor: { type: number }
        trades: { type: integer }
        hitRate: { type: number }
        forecastMase: { type: number }
        quantileCoverage: { type: number, description: Quota di osservazioni dentro q10-q90 }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
